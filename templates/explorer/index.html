{% extends "base.html" %}

{% block title %}{{ title }}{% endblock %}

{% block content %}
<main style="font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; max-width: 800px; margin: 4rem auto; padding: 0 1rem; line-height: 1.6; color: #1e293b;">
    <h1 style="color: #0f172a; border-bottom: 2px solid #0284c7; padding-bottom: 0.5rem;">{{ title }}</h1>
    <p style="color: #0284c7; font-weight: 600; font-size: 1.1rem;">{{ status }}</p>
    <p>Cấu trúc Django project, template và routing cho ứng dụng thám hiểm biển sâu đã được thiết lập thành công.</p>
</main>
{% endblock %}
